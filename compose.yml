---
services:
  devopsdb:
    image: dbimage:latest
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: appimage:latest
    ports:
      - "1111:8080"
    deploy:
      replicas: 1
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
